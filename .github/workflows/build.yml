name: Build

on:
  push:
    branches: [main]
  pull_request:

# Cancels a superseded pull_request run so its later flaky-test data doesn't compete for the same
# runner pool as the newer push -- never cancels a push to main, so every commit on main keeps its
# own CI record (issue #258 wants a full failure-rate history to compare against).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            core/build/reports/tests
            wear/build/reports/tests
            app/build/reports/lint-results-debug.html
            core/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html

  # issue #304: the Room migration tests are instrumented tests (core/src/androidTest), so they
  # need an emulator; the job above only runs JVM unit tests.
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :core:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-reports
          path: core/build/reports/androidTests
